
<a href="{% url 'library:game_detail' game.pk %}" class="game-card">
    <div class="game-cover">
        {% if game.cover_image_url %}
            <img src="{{ game.cover_image_url }}"
                 alt="{{ game.title }} cover"
                 loading="lazy">
        {% else %}
            <div class="cover-placeholder">
                <span>🎮</span>
                <small>{{ game.title|truncatechars:28 }}</small>
            </div>
        {% endif %}
        <span class="status-badge status-{{ game.status }}">
            {{ game.get_status_display }}
        </span>
    </div>

    <div class="game-card-body">
        <h3 class="game-card-title">{{ game.title }}</h3>
        <p class="game-card-developer">
            {{ game.developer|default:"Unknown developer" }}
        </p>
        <div class="game-card-genres">
            {% for genre in game.genres.all|slice:":2" %}
                <span>{{ genre.name }}</span>
            {% empty %}
                <span>Uncategorized</span>
            {% endfor %}
        </div>
    </div>
</a>
